name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: .\build_web_gui_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            *.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse imagemagick openssl openvpn
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke-test system crypto tools
        run: |
          set -e
          command -v openssl
          command -v openvpn
          env LD_LIBRARY_PATH= /usr/bin/openssl version
          rm -f /tmp/ta-test.key
          env LD_LIBRARY_PATH= /usr/bin/openvpn --genkey secret /tmp/ta-test.key
          test -s /tmp/ta-test.key
          rm -f /tmp/ta-test.key

      - name: Build Linux executable
        run: bash build_web_gui_linux.sh

      - name: Build AppImage
        run: bash build_web_gui_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/**
            AppDir/**
            *.AppImage