name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: .\build_web_gui_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            *.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse imagemagick openssl openvpn
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke-test system crypto tools
        run: |
          set -e
          OPENSSL="$(command -v openssl)"
          OPENVPN="$(command -v openvpn)"
          "$OPENSSL" version
          rm -f /tmp/ta-test.key
          env LD_LIBRARY_PATH= "$OPENVPN" --genkey secret /tmp/ta-test.key
          test -s /tmp/ta-test.key
          rm -f /tmp/ta-test.key

      - name: Build Linux executable
        run: bash build_web_gui_linux.sh

      - name: Build AppImage
        run: bash build_web_gui_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/**
            AppDir/**
            *.AppImage

  release:
    # Publish a GitHub Release only for version tags, not manual test runs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          cp artifacts/windows-exe/dist/EZ-OpenVPN-Toolkit-Web.exe .
          cp artifacts/linux-artifacts/dist/EZ-OpenVPN-Toolkit-Web .
          cp artifacts/linux-artifacts/dist/EZ-OpenVPN-Toolkit-Web-x86_64.AppImage .
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-from-tag \
            --verify-tag \
            EZ-OpenVPN-Toolkit-Web.exe \
            EZ-OpenVPN-Toolkit-Web \
            EZ-OpenVPN-Toolkit-Web-x86_64.AppImage
